[package]
name = "mm"
version = "0.2.2"
edition = "2024"
description = "Generate a Conventional Commit message from Git changes and commit it"
license = "MIT"
repository = "https://github.com/MichaelCurrin/auto-commit-msg"
readme = "README.md"
default-run = "mm"

[[bin]]
name = "mm"
path = "src/main.rs"

[lib]
name = "mm"
path = "src/lib.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1

[dependencies]
serde_json = "1.0.154"
serde_norway = "0.9.42"
