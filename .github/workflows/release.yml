name: Release

on:
  push:
    tags:
      - 'release-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create-release.outputs.upload_url }}
      version: ${{ steps.extract-version.outputs.version }}
      tag_name: ${{ steps.extract-version.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract tag and version
        id: extract-version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#release-}"
          VERSION="${VERSION#v}"
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # If tag is release-X.Y.Z, ensure release-vX.Y.Z also exists as an alias tag for compatibility
          if [[ "$TAG" =~ ^release-[0-9] ]]; then
            ALIAS_TAG="release-v${VERSION}"
            if ! git rev-parse "$ALIAS_TAG" >/dev/null 2>&1; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag -a "$ALIAS_TAG" -m "Release v${VERSION}"
              git push origin "$ALIAS_TAG" || true
            fi
          fi

      - name: Create GitHub Release
        id: create-release
        uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-binaries:
    name: Build & Upload (${{ matrix.target }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Linux aarch64 (ARM64)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          # macOS Intel (x86_64)
          - target: x86_64-apple-darwin
            os: macos-13
          # macOS Apple Silicon (aarch64)
          - target: aarch64-apple-darwin
            os: macos-latest
          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross for Linux aarch64
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build & Upload Release Binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: mm
          target: ${{ matrix.target }}
          archive: $bin-$target
          tar: unix
          zip: windows
          include: README.md, LICENSE
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-homebrew:
    name: Generate & Publish Homebrew Formula
    needs: [create-release, upload-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ needs.create-release.outputs.tag_name }}" \
            --pattern "mm-*.tar.gz" \
            --pattern "mm-*.zip"

      - name: Generate SHA256 checksums
        id: checksums
        run: |
          sha256sum mm-*.tar.gz mm-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

          DARWIN_ARM64_SHA=$(sha256sum mm-aarch64-apple-darwin.tar.gz | awk '{print $1}')
          DARWIN_X86_64_SHA=$(sha256sum mm-x86_64-apple-darwin.tar.gz | awk '{print $1}')
          LINUX_ARM64_SHA=$(sha256sum mm-aarch64-unknown-linux-gnu.tar.gz | awk '{print $1}')
          LINUX_X86_64_SHA=$(sha256sum mm-x86_64-unknown-linux-gnu.tar.gz | awk '{print $1}')

          echo "darwin_arm64_sha=${DARWIN_ARM64_SHA}" >> "$GITHUB_OUTPUT"
          echo "darwin_x86_64_sha=${DARWIN_X86_64_SHA}" >> "$GITHUB_OUTPUT"
          echo "linux_arm64_sha=${LINUX_ARM64_SHA}" >> "$GITHUB_OUTPUT"
          echo "linux_x86_64_sha=${LINUX_X86_64_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload SHA256SUMS.txt to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.create-release.outputs.tag_name }}" SHA256SUMS.txt --clobber

      - name: Generate Homebrew Formula
        run: |
          mkdir -p Formula
          TAG="${{ needs.create-release.outputs.tag_name }}"
          VERSION="${{ needs.create-release.outputs.version }}"
          DARWIN_ARM64_SHA="${{ steps.checksums.outputs.darwin_arm64_sha }}"
          DARWIN_X86_64_SHA="${{ steps.checksums.outputs.darwin_x86_64_sha }}"
          LINUX_ARM64_SHA="${{ steps.checksums.outputs.linux_arm64_sha }}"
          LINUX_X86_64_SHA="${{ steps.checksums.outputs.linux_x86_64_sha }}"

          cat <<EOF > Formula/mm.rb
          class Mm < Formula
            desc "Generate a Conventional Commit message from Git changes and commit it"
            homepage "https://github.com/loclv/mm"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/loclv/mm/releases/download/${TAG}/mm-aarch64-apple-darwin.tar.gz"
                sha256 "${DARWIN_ARM64_SHA}"
              end
              on_intel do
                url "https://github.com/loclv/mm/releases/download/${TAG}/mm-x86_64-apple-darwin.tar.gz"
                sha256 "${DARWIN_X86_64_SHA}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/loclv/mm/releases/download/${TAG}/mm-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${LINUX_ARM64_SHA}"
              end
              on_intel do
                url "https://github.com/loclv/mm/releases/download/${TAG}/mm-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${LINUX_X86_64_SHA}"
              end
            end

            def install
              bin.install "mm"
            end

            test do
              assert_match "Generate a Conventional Commit message", shell_output("#{bin}/mm --help")
            end
          end
          EOF
          sed -i 's/^          //' Formula/mm.rb
          cat Formula/mm.rb

      - name: Upload Formula/mm.rb to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.create-release.outputs.tag_name }}" Formula/mm.rb --clobber

      - name: Push formula to Homebrew tap repository
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'loclv/homebrew-tap' }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice ::HOMEBREW_TAP_TOKEN is not set. Formula/mm.rb was generated and uploaded to the release assets. To automate pushing to your tap repository, configure the HOMEBREW_TAP_TOKEN secret (and optionally HOMEBREW_TAP_REPO variable)."
            exit 0
          fi

          echo "Cloning tap repository: ${TAP_REPO}..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap_repo
          mkdir -p tap_repo/Formula
          cp Formula/mm.rb tap_repo/Formula/mm.rb
          cd tap_repo
          git add Formula/mm.rb
          if git diff --staged --quiet; then
            echo "Formula is already up to date in ${TAP_REPO}."
          else
            git commit -m "chore(formula): update mm to v${VERSION}"
            git push origin HEAD
            echo "Successfully updated formula in ${TAP_REPO}."
          fi
